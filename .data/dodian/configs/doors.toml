# Doors on the Dodian maps that open and close (dodian mode only, packed with this folder).
# Each door needs two blocks: the closed object and the open object, pointing at each other with
# next_loc_stage. Single doors use the single door content groups, double doors the left/right ones.
# See docs/doors.md. Do not write gameval names in comments here: the config packer resolves them too.

# Door (6x on the Dodian maps)
[[object]]
id = "loc.kr_poordoor"
inherit = "loc.kr_poordoor"
contentGroup = "content.closed_single_door"

[object.params]
"param.next_loc_stage" = "loc.kr_poordooropen"
"param.opensound" = "synth.nicedoor_open"

[[object]]
id = "loc.kr_poordooropen"
inherit = "loc.kr_poordooropen"
contentGroup = "content.opened_single_door"

[object.params]
"param.next_loc_stage" = "loc.kr_poordoor"
"param.closesound" = "synth.nicedoor_close"

