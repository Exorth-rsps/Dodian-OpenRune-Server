# Plugin-script packages that do NOT start when `gamemode: "dodian"` is set in game.yml.
# A package also disables everything below it (org.rsmod.content.areas also covers
# org.rsmod.content.areas.city.lumbridge). Normal mode ignores this file.
packages = [
    "org.rsmod.content.areas",
    "org.rsmod.content.bosses",
    # Only the OSRS quests; the quest manager stays on so the quest tab lists Dodian quests only.
    "org.rsmod.content.quest.area",
    # content/events/shooting-stars lives in a skills package
    "org.rsmod.content.skills.shootingstars",
    # Dodian's own guild door (content/dodian DodianGuildDoors) asks for the level only.
    "org.rsmod.content.skills.crafting.CraftingGuildDoor",
]
